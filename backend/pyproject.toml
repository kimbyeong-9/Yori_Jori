[project]
name = "yorijori-backend"
version = "0.1.0"
description = "요리조리 (Yori Jori) backend"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

