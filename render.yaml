services:
  - type: web
    name: yorijori-backend
    runtime: python
    rootDir: backend
    plan: free
    # DATABASE_URL이 설정된 뒤에는 배포마다 마이그레이션 적용 + 시드 확인까지 자동으로
    # 실행된다(둘 다 idempotent라 반복 실행해도 안전 — alembic은 이미 적용된 리비전을
    # 건너뛰고, run_seed는 normalized_name으로 존재 여부를 확인 후 없을 때만 만든다).
    buildCommand: pip install uv && uv sync --frozen --no-dev && uv run alembic upgrade head && uv run python -m app.seed.run_seed
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "35"
      - key: CORS_ORIGINS
        value: https://yori-jori-psi.vercel.app
